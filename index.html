<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111318">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Kirodex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="splash.css">
  <link rel="icon" href="icons/Kirodex-icon-192.png" type="image/png">
</head>

<body>
  <!--Splash screen-->
  <div id="splash" class="splash" aria-hidden="true">
    <img src="images/kirodex-logo.webp" alt="" class="splash-logo">
  </div>

  <!--Main content-->
  <main>
    <header class="app-header">
      <h1 class="app-title">Okaeri!</h1>
      <p class="app-tagline">Welcome back. Pick up where you left off.</p>
    </header>

    <nav class="tabs" aria-label="Choose anime or manga">
      <button class="tab" data-type="ANIME" aria-pressed="true">Anime</button>
      <button class="tab" data-type="MANGA" aria-pressed="false">Manga</button>
    </nav>

    <section class="search">
      <label for="search-input" class="search-label">Search AniList</label>
      <input id="search-input" type="search" placeholder="Search anime..." autocomplete="off">
      <ul id="results" class="list"></ul>
    </section>

    <div class="filters" role="group" aria-label="Filter by status">
      <button class="filter" data-status="CURRENT" aria-pressed="true">
        <span class="filter-label">Watching</span> <span class="filter-count">0</span>
      </button>
      <button class="filter" data-status="COMPLETED" aria-pressed="false">
        <span class="filter-label">Completed</span> <span class="filter-count">0</span>
      </button>
      <button class="filter" data-status="PLANNING" aria-pressed="false">
        <span class="filter-label">Plan to watch</span> <span class="filter-count">0</span>
      </button>
    </div>

    <ul id="list" class="list"></ul>

  </main>

  <!-- Edit panel -->
  <dialog id="edit-dialog" class="sheet" aria-labelledby="edit-title">
    <form id="edit-form" class="sheet-form">
      <h2 id="edit-title" class="sheet-title"></h2>

      <label for="edit-progress" id="edit-progress-label" class="field-label">Episodes watched</label>
      <div class="progress-field">
        <input id="edit-progress" type="number" inputmode="numeric" min="0" step="1">
        <span id="edit-total" class="field-suffix"></span>
      </div>

      <label for="edit-status" class="field-label">Status</label>
      <select id="edit-status">
        <option value="CURRENT">Watching</option>
        <option value="COMPLETED">Completed</option>
        <option value="PLANNING">Plan to watch</option>
      </select>

      <div class="sheet-actions">
        <button type="button" class="btn-danger" data-action="remove">Remove</button>
        <button type="button" class="btn-secondary" data-action="cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="main.js"></script>

</body>

</html>
